server {
    listen 80;
    listen [::]:80;
    server_name x1vow.xyz www.x1vow.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://x1vow.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.x1vow.xyz;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/x1vow.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x1vow.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://x1vow.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name x1vow.xyz;
    ssl_certificate /etc/letsencrypt/live/x1vow.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x1vow.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:x1vow:5m;
    ssl_session_tickets off;
    include snippets/x1vow-site.conf;
}
