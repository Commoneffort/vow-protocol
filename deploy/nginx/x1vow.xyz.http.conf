# Stage 1, before the certificate exists: answers only ACME challenges.
server {
    listen 80;
    listen [::]:80;
    server_name x1vow.xyz www.x1vow.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 503; }
}
